
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSTA PAGE</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black min-h-screen flex justify-center items-start sm:items-center p-3 sm:p-6">

    <!-- Main Instagram Box -->
    <div class="bg-white w-full max-w-[370px] min-h-[690px] mt-4 sm:mt-8 p-3">

        <!-- Search Bar -->
        <div class="relative bg-gray-200 h-10 w-full rounded-3xl flex items-center px-5">
            <p class="text-gray-500 text-sm">⌕ Search with Meta AI</p>
        </div>

        <!-- Instagram Grid -->
        <div class="grid grid-cols-3 gap-1 mt-5">

            <!-- Image 1 -->
            <div class="aspect-[3/4] bg-gray-200 overflow-hidden">
                <img class="w-full h-full object-cover"
                src="https://i.pinimg.com/1200x/93/c8/58/93c8589c645ad20b133e18f428d8c23c.jpg">
            </div>

            <!-- Image 2 -->
            <div class="aspect-[3/4] bg-gray-200 overflow-hidden">
                <img class="w-full h-full object-cover"
                src="https://i.pinimg.com/1200x/38/a4/ff/38a4ff33adbda56c4aafa9865e870d77.jpg">
            </div>

            <!-- Video 1 -->
            <div class="row-span-2 bg-gray-200 overflow-hidden">
                <video class="w-full h-full object-cover" controls autoplay disablepictureinpicture loop>
                    <source src="rowoon.mp4" type="video/mp4">
                </video>
            </div>

            <!-- Video 2 -->
            <div class="row-span-2 bg-gray-200 overflow-hidden">
                <video class="w-full h-full object-cover" controls muted loop>
                    <source src="rowoon2.mp4" type="video/mp4">
                </video>
            </div>

            <!-- Image 3 -->
            <div class="aspect-[3/4] bg-gray-200 overflow-hidden">
                <img class="w-full h-full object-cover"
                src="https://i.pinimg.com/1200x/71/71/a2/7171a22f51a98493c9a613152d8de67d.jpg">
            </div>

            <!-- Image 4 -->
            <div class="aspect-[3/4] bg-gray-200 overflow-hidden">
                <img class="w-full h-full object-cover"
                src="https://i.pinimg.com/736x/4a/26/66/4a266631656275f2883e48608366ce98.jpg">
            </div>

            <!-- Image 5 -->
            <div class="aspect-[3/4] bg-gray-200 overflow-hidden">
                <img class="w-full h-full object-cover"
                src="https://i.pinimg.com/1200x/77/c4/6d/77c46db8172a9c35ebf1cf57f258d6b6.jpg">
            </div>

            <!-- Image 6 -->
            <div class="aspect-[3/4] bg-gray-200 overflow-hidden">
                <img class="w-full h-full object-cover"
                src="https://i.pinimg.com/736x/c3/93/80/c39380ef4beff0da0fac954b7b53108d.jpg">
            </div>

            <!-- Image 7 -->
            <div class="aspect-[3/4] bg-gray-200 overflow-hidden">
                <img class="w-full h-full object-cover"
                src="https://i.pinimg.com/736x/02/af/58/02af58c7b51c743513815a5852011bb3.jpg">
            </div>

            <!-- Image 8 -->
            <div class="aspect-[3/4] bg-gray-200 overflow-hidden">
                <img class="w-full h-full object-cover"
                src="https://i.pinimg.com/736x/80/81/a3/8081a341b54b0bdc2d928d7f5961c96e.jpg">
            </div>

        </div>
    </div>

</body>
</html>
